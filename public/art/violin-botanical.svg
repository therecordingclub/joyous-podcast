  <!-- Pegbox -->
  <path d="M238,50 L238,22 Q238,15 242,12 L258,12 Q262,15 262,22 L262,50"
    class="violin-stroke" stroke-width="1.2"/>
  <!-- Pegs -->
  <ellipse cx="236" cy="25" rx="5" ry="2" fill="#3D2B1F" opacity="0.2" stroke="#3D2B1F" stroke-width="0.6" transform="rotate(-15,236,25)"/>
  <ellipse cx="264" cy="28" rx="5" ry="2" fill="#3D2B1F" opacity="0.2" stroke="#3D2B1F" stroke-width="0.6" transform="rotate(15,264,28)"/>
  <ellipse cx="236" cy="38" rx="5" ry="2" fill="#3D2B1F" opacity="0.2" stroke="#3D2B1F" stroke-width="0.6" transform="rotate(-15,236,38)"/>
  <ellipse cx="264" cy="41" rx="5" ry="2" fill="#3D2B1F" opacity="0.2" stroke="#3D2B1F" stroke-width="0.6" transform="rotate(15,264,41)"/>

  <!-- Scroll -->
  <path d="M250,12 Q250,5 248,0 Q245,-5 240,-6 Q234,-5 232,-1 Q230,4 232,8 Q235,12 240,13 Q244,13 246,10 Q247,7 245,5 Q243,3 241,5"
