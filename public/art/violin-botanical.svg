    <!-- Leaves along left vine -->
    <path d="M158,390 Q140,385 132,375 Q128,368 135,365 Q142,364 150,372 Q156,380 158,390Z" class="leaf"/>
    <path d="M158,390 Q142,378 136,370" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>

    <path d="M155,345 Q168,338 176,328 Q180,322 174,320 Q168,320 160,327 Q154,335 155,345Z" class="leaf"/>

    <path d="M160,300 Q142,295 134,285 Q130,278 137,276 Q144,275 152,283 Q158,291 160,300Z" class="leaf"/>
    <path d="M160,300 Q144,290 138,282" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>

    <path d="M158,260 Q170,252 178,242 Q182,236 175,234 Q168,234 160,242 Q155,250 158,260Z" class="leaf"/>

    <path d="M150,220 Q132,215 124,205 Q120,198 127,196 Q134,195 142,203 Q148,211 150,220Z" class="leaf"/>

    <path d="M148,190 Q162,182 170,172 Q174,166 167,164 Q160,164 152,172 Q146,180 148,190Z" class="leaf-dark"/>

    <!-- Tendril curls -->
    <path d="M155,355 Q148,352 145,348 Q143,345 146,344 Q149,345 150,349" class="vine-stroke" stroke-width="0.6"/>
    <path d="M160,270 Q153,267 150,263 Q148,260 151,259 Q154,260 155,264" class="vine-stroke" stroke-width="0.6"/>
    <path d="M150,155 Q143,152 140,148 Q138,145 141,144 Q144,145 145,149" class="vine-stroke" stroke-width="0.6"/>

    <!-- Small buds -->
    <circle cx="152" cy="175" r="3" fill="#C4956A" opacity="0.2" stroke="#3D2B1F" stroke-width="0.4"/>
    <path d="M152,172 Q150,170 152,168 Q154,170 152,172Z" fill="#7D8B6A" opacity="0.3" stroke="#2D4A3E" stroke-width="0.3"/>

    <!-- Large leaf near scroll -->
    <path d="M165,100 Q145,92 135,80 Q130,72 138,68 Q146,66 155,75 Q162,84 165,95Z" class="leaf"/>
    <path d="M165,100 Q148,88 140,78" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>
    <path d="M165,100 Q150,95 143,88" fill="none" stroke="#2D4A3E" stroke-width="0.2" opacity="0.2"/>

    <path d="M168,65 Q152,58 148,48 Q146,42 152,42 Q158,44 162,52 Q166,60 168,65Z" class="leaf-dark"/>
  </g>

  <!-- RIGHT VINE — growing up from lower bout -->
  <g>
    <path d="M325,400 Q340,375 345,345 Q348,315 340,285 Q332,255 338,225 Q344,195 350,170 Q356,145 348,115 Q340,90 335,65"
      class="vine-stroke" stroke-width="1.3"/>

    <!-- Leaves along right vine -->
    <path d="M340,370 Q358,365 366,355 Q370,348 363,346 Q356,346 348,353 Q342,361 340,370Z" class="leaf"/>
    <path d="M340,370 Q356,360 362,352" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>

    <path d="M345,330 Q328,325 320,315 Q316,308 323,306 Q330,305 338,313 Q344,321 345,330Z" class="leaf"/>

    <path d="M338,290 Q356,285 364,275 Q368,268 361,266 Q354,266 346,273 Q340,281 338,290Z" class="leaf"/>

    <path d="M340,250 Q322,245 314,235 Q310,228 317,226 Q324,225 332,233 Q338,241 340,250Z" class="leaf-dark"/>

    <path d="M345,210 Q362,205 370,195 Q374,188 367,186 Q360,186 352,193 Q346,201 345,210Z" class="leaf"/>
    <path d="M345,210 Q360,200 366,192" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>

    <path d="M350,170 Q332,165 324,155 Q320,148 327,146 Q334,145 342,153 Q348,161 350,170Z" class="leaf"/>

    <!-- Tendrils -->
    <path d="M340,340 Q347,337 350,333 Q352,330 349,329 Q346,330 345,334" class="vine-stroke" stroke-width="0.6"/>
    <path d="M340,260 Q347,257 350,253 Q352,250 349,249 Q346,250 345,254" class="vine-stroke" stroke-width="0.6"/>

    <!-- Bud -->
    <circle cx="348" cy="140" r="3" fill="#C4956A" opacity="0.2" stroke="#3D2B1F" stroke-width="0.4"/>
    <path d="M348,137 Q346,135 348,133 Q350,135 348,137Z" fill="#7D8B6A" opacity="0.3" stroke="#2D4A3E" stroke-width="0.3"/>

    <!-- Large leaves near top -->
    <path d="M345,115 Q362,108 370,98 Q374,90 367,88 Q360,88 352,96 Q346,105 345,115Z" class="leaf"/>
    <path d="M345,115 Q360,104 366,95" fill="none" stroke="#2D4A3E" stroke-width="0.3" opacity="0.3"/>

    <path d="M338,80 Q355,72 360,62 Q362,56 356,56 Q350,58 345,65 Q340,73 338,80Z" class="leaf-dark"/>
  </g>

  <!-- BOTTOM VINE — across endpin area -->
  <g>
    <path d="M210,520 Q220,540 235,550 Q250,555 265,550 Q280,540 290,520"
      class="vine-stroke" stroke-width="1"/>
    <path d="M235,548 Q228,560 218,565 Q212,566 214,560 Q218,555 225,550Z" class="leaf"/>
    <path d="M265,548 Q272,560 282,565 Q288,566 286,560 Q282,555 275,550Z" class="leaf"/>
    <!-- Small hanging berry -->
    <circle cx="250" cy="560" r="2.5" fill="#C4956A" opacity="0.2" stroke="#3D2B1F" stroke-width="0.4"/>
    <path d="M250,555 L250,557" class="vine-stroke" stroke-width="0.5"/>
  </g>

  <!-- TOP — vine tendril around scroll -->
  <g>
    <path d="M168,55 Q165,40 170,28 Q175,18 185,15 Q195,14 200,22"
      class="vine-stroke" stroke-width="0.8"/>
    <path d="M175,30 Q168,24 165,18 Q164,14 168,14 Q172,16 174,22Z" class="leaf-dark"/>

    <path d="M335,65 Q332,48 336,35 Q340,25 330,18 Q320,14 310,20"
      class="vine-stroke" stroke-width="0.8"/>
    <path d="M332,40 Q340,34 344,28 Q346,24 342,24 Q338,26 336,32Z" class="leaf-dark"/>
  </g>

  <!-- Small flowers scattered -->
  <g transform="translate(135, 145)" opacity="0.6">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#C4956A" stroke-width="0.5"/>
    <path d="M0,-5 Q2,-8 0,-10 Q-2,-8 0,-5Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M5,0 Q8,2 10,0 Q8,-2 5,0Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M0,5 Q2,8 0,10 Q-2,8 0,5Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M-5,0 Q-8,2 -10,0 Q-8,-2 -5,0Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="2" fill="#C4956A" opacity="0.3"/>
  </g>

  <g transform="translate(365, 160)" opacity="0.5">
    <circle cx="0" cy="0" r="4" fill="none" stroke="#C4956A" stroke-width="0.5"/>
    <path d="M0,-4 Q1.5,-6.5 0,-8 Q-1.5,-6.5 0,-4Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M4,0 Q6.5,1.5 8,0 Q6.5,-1.5 4,0Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M0,4 Q1.5,6.5 0,8 Q-1.5,6.5 0,4Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <path d="M-4,0 Q-6.5,1.5 -8,0 Q-6.5,-1.5 -4,0Z" fill="#C4956A" opacity="0.2" stroke="#C4956A" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="1.5" fill="#C4956A" opacity="0.3"/>
  </g>
</svg>