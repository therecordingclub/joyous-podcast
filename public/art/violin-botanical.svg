<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <style>
      .violin-stroke { fill: none; stroke: #3D2B1F; stroke-linecap: round; stroke-linejoin: round; }
      .vine-stroke { fill: none; stroke: #7D8B6A; stroke-linecap: round; stroke-linejoin: round; }
      .leaf { fill: #7D8B6A; opacity: 0.35; stroke: #2D4A3E; stroke-width: 0.6; }
      .leaf-dark { fill: #2D4A3E; opacity: 0.2; stroke: #2D4A3E; stroke-width: 0.5; }
      .amber { fill: #C4956A; opacity: 0.15; }
    </style>
  </defs>

  <!-- VIOLIN BODY -->
  <!-- Main body outline -->
  <path d="M250,120
    C285,120 310,140 318,165
    C326,190 320,210 308,225
    C296,240 282,248 278,260
    C274,272 280,285 290,300
    C310,330 325,360 325,400
    C325,440 310,475 290,500
    C270,525 250,535 250,540
    C250,535 230,525 210,500
    C190,475 175,440 175,400
    C175,360 190,330 210,300
    C220,285 226,272 222,260
    C218,248 204,240 192,225
    C180,210 174,190 182,165
    C190,140 215,120 250,120Z"
    fill="#FAF6F0" opacity="0.3" stroke="#3D2B1F" stroke-width="1.8"/>

  <!-- Upper bouts curve detail -->
  <path d="M250,120 C275,118 295,128 305,145" class="violin-stroke" stroke-width="0.5" opacity="0.3"/>
  <path d="M250,120 C225,118 205,128 195,145" class="violin-stroke" stroke-width="0.5" opacity="0.3"/>

  <!-- C-bouts (waist curves) -->
  <path d="M222,260 C218,248 205,242 195,232 C188,224 186,216 190,208"
    class="violin-stroke" stroke-width="0.8" opacity="0.5"/>
  <path d="M278,260 C282,248 295,242 305,232 C312,224 314,216 310,208"
    class="violin-stroke" stroke-width="0.8" opacity="0.5"/>

  <!-- F-holes -->
  <g transform="translate(220, 280)">
    <path d="M0,0 Q-4,-15 -2,-30 Q0,-40 5,-45 Q8,-42 6,-35 Q3,-20 4,-5 Q5,10 8,25 Q10,35 6,40 Q2,38 4,30 Q5,20 3,5Z"
      class="violin-stroke" stroke-width="1.2"/>
    <!-- F-hole notches -->
    <circle cx="5" cy="-42" r="2" fill="#3D2B1F" opacity="0.3"/>
    <circle cx="5" cy="37" r="2" fill="#3D2B1F" opacity="0.3"/>
  </g>
  <g transform="translate(280, 280) scale(-1,1)">
    <path d="M0,0 Q-4,-15 -2,-30 Q0,-40 5,-45 Q8,-42 6,-35 Q3,-20 4,-5 Q5,10 8,25 Q10,35 6,40 Q2,38 4,30 Q5,20 3,5Z"
      class="violin-stroke" stroke-width="1.2"/>
    <circle cx="5" cy="-42" r="2" fill="#3D2B1F" opacity="0.3"/>
    <circle cx="5" cy="37" r="2" fill="#3D2B1F" opacity="0.3"/>
  </g>

  <!-- Bridge -->
  <path d="M228,350 L232,340 Q240,335 250,335 Q260,335 268,340 L272,350"
    class="violin-stroke" stroke-width="1" opacity="0.4"/>
  <path d="M232,340 L232,350" class="violin-stroke" stroke-width="0.5" opacity="0.3"/>
  <path d="M268,340 L268,350" class="violin-stroke" stroke-width="0.5" opacity="0.3"/>

  <!-- Tailpiece -->
  <path d="M240,390 L240,440 Q240,450 250,452 Q260,450 260,440 L260,390"
    class="violin-stroke" stroke-width="0.8" opacity="0.35"/>
  <!-- Fine tuners -->
  <circle cx="244" cy="395" r="1.5" fill="#3D2B1F" opacity="0.25"/>
  <circle cx="250" cy="393" r="1.5" fill="#3D2B1F" opacity="0.25"/>
  <circle cx="256" cy="395" r="1.5" fill="#3D2B1F" opacity="0.25"/>

  <!-- Chin rest -->
  <path d="M250,452 Q240,460 235,475 Q232,490 240,498 Q250,504 260,498 Q268,490 265,475"
    class="violin-stroke" stroke-width="0.8" opacity="0.3"/>

  <!-- Strings -->
  <line x1="242" y1="145" x2="244" y2="390" stroke="#3D2B1F" stroke-width="0.4" opacity="0.25"/>
  <line x1="248" y1="143" x2="249" y2="388" stroke="#3D2B1F" stroke-width="0.4" opacity="0.25"/>
  <line x1="252" y1="143" x2="251" y2="388" stroke="#3D2B1F" stroke-width="0.4" opacity="0.25"/>
  <line x1="258" y1="145" x2="256" y2="390" stroke="#3D2B1F" stroke-width="0.4" opacity="0.25"/>

  <!-- Neck -->
  <path d="M240,120 L240,65 Q240,55 245,50 L255,50 Q260,55 260,65 L260,120"
