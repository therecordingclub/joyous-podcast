  <!-- BOTANICAL ELEMENTS — vines growing around -->
  <!-- ============================================ -->

  <!-- LEFT VINE — growing up from lower bout -->
  <g>
    <path d="M175,420 Q160,400 155,370 Q150,340 158,310 Q165,280 160,250 Q155,220 148,195 Q142,170 150,145 Q158,120 165,100 Q172,80 168,55"
