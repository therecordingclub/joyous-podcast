    <ellipse cx="0" cy="-52" rx="3" ry="4.5" fill="#7D8B6A" opacity="0.3" stroke="#2D4A3E" stroke-width="0.5"/>
    <ellipse cx="-2.5" cy="-48" rx="2.5" ry="3.5" fill="#7D8B6A" opacity="0.25" stroke="#2D4A3E" stroke-width="0.5"/>
    <ellipse cx="2.5" cy="-48" rx="2.5" ry="3.5" fill="#7D8B6A" opacity="0.25" stroke="#2D4A3E" stroke-width="0.5"/>
    <ellipse cx="-2" cy="-43" rx="2.2" ry="3" fill="#7D8B6A" opacity="0.2" stroke="#2D4A3E" stroke-width="0.4"/>
    <ellipse cx="2" cy="-43" rx="2.2" ry="3" fill="#7D8B6A" opacity="0.2" stroke="#2D4A3E" stroke-width="0.4"/>
    <ellipse cx="-1.5" cy="-38" rx="2" ry="2.8" fill="#7D8B6A" opacity="0.18" stroke="#2D4A3E" stroke-width="0.4"/>
