    <path d="M6,-29 Q9,-31 11,-35 Q9,-36 7,-33 Q6,-30 6,-29Z" class="leaf-dark" stroke-width="0.3"/>
  </g>

  <!-- ROSEMARY SPRIG 2 — right side (mirrored) -->
  <g transform="translate(950, 40) scale(-1,1)">
    <path d="M0,0 Q-3,-15 -2,-35 Q0,-45 2,-50" class="stem" stroke-width="1"/>
    <path d="M-2,-10 Q-10,-14 -14,-18 Q-12,-20 -6,-16 Q-2,-13 -2,-10Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M-1,-10 Q5,-14 9,-18 Q11,-16 7,-13 Q3,-10 -1,-10Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M-2,-18 Q-10,-22 -14,-26 Q-12,-28 -6,-24 Q-2,-21 -2,-18Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M-1,-18 Q5,-22 9,-26 Q11,-24 7,-21 Q3,-18 -1,-18Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M-2,-26 Q-8,-30 -12,-34 Q-10,-36 -5,-32 Q-2,-29 -2,-26Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M0,-26 Q6,-30 10,-34 Q12,-32 7,-29 Q2,-26 0,-26Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M0,-34 Q-6,-38 -10,-42 Q-8,-44 -3,-40 Q0,-37 0,-34Z" class="leaf-dark" stroke-width="0.3"/>
    <path d="M1,-34 Q7,-38 11,-42 Q12,-40 8,-37 Q3,-34 1,-34Z" class="leaf-dark" stroke-width="0.3"/>
    <path d="M2,-42 Q-1,-45 -2,-48 Q0,-49 2,-46 Q3,-44 2,-42Z" class="leaf-dark" stroke-width="0.3"/>
    <path d="M2,-42 Q5,-45 7,-48 Q8,-46 5,-43 Q3,-42 2,-42Z" class="leaf-dark" stroke-width="0.3"/>
