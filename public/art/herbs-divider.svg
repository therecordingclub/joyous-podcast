    <path d="M-2,-26 Q-8,-30 -12,-34 Q-10,-36 -5,-32 Q-2,-29 -2,-26Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M0,-26 Q6,-30 10,-34 Q12,-32 7,-29 Q2,-26 0,-26Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M0,-34 Q-6,-38 -10,-42 Q-8,-44 -3,-40 Q0,-37 0,-34Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M1,-34 Q7,-38 11,-42 Q12,-40 8,-37 Q3,-34 1,-34Z" class="leaf-sage" stroke-width="0.4"/>
    <path d="M1,-42 Q-4,-46 -7,-50 Q-5,-51 -1,-48 Q1,-45 1,-42Z" class="leaf-dark" stroke-width="0.3"/>
