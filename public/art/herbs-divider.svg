    <path d="M1,-30 Q4,-31 5,-30" class="stem" stroke-width="0.3" opacity="0.4"/>
  </g>

  <!-- THYME SPRIG 2 — center-right (mirrored) -->
  <g transform="translate(780, 40) scale(-1,1)">
    <path d="M0,0 Q2,-8 5,-20 Q7,-30 6,-38" class="stem" stroke-width="0.8"/>
    <path d="M4,-8 Q0,-10 -2,-14 Q0,-16 4,-12 Q6,-9 4,-8Z" class="leaf-sage" stroke-width="0.4"/>
