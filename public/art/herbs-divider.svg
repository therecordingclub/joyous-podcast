<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <style>
      .stem { fill: none; stroke: #2D4A3E; stroke-linecap: round; stroke-linejoin: round; }
      .leaf-dark { fill: #2D4A3E; opacity: 0.15; stroke: #2D4A3E; stroke-width: 0.6; stroke-linecap: round; }
      .leaf-sage { fill: #7D8B6A; opacity: 0.25; stroke: #2D4A3E; stroke-width: 0.5; stroke-linecap: round; }
