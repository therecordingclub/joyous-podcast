  <!-- Small decorative dots along line -->
  <circle cx="160" cy="40" r="1.2" fill="#2D4A3E" opacity="0.25"/>
  <circle cx="340" cy="40" r="1.2" fill="#2D4A3E" opacity="0.25"/>
  <circle cx="510" cy="40" r="1.2" fill="#2D4A3E" opacity="0.25"/>
  <circle cx="690" cy="40" r="1.2" fill="#2D4A3E" opacity="0.25"/>
