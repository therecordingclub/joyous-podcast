<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Ink wash gradients simulating wet-to-dry brush -->
    <linearGradient id="dryBrush1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222222" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#1a1a1a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#333333" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#555555" stop-opacity="0.4"/>
      <stop offset="95%" stop-color="#777777" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#999999" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="dryBrush2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#999999" stop-opacity="0.02"/>
      <stop offset="5%" stop-color="#777777" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#444444" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#222222" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#333333" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#555555" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="dryBrush3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#222222" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#1a1a1a" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#333333" stop-opacity="0.6"/>
      <stop offset="90%" stop-color="#666666" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters for ink texture -->
    <filter id="inkTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="roughEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="tinyBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Outer ink wash halo -->
  <path d="M200,52
    C280,48 340,85 355,145
    C372,210 355,280 310,325
    C265,370 200,380 145,365
    C85,348 48,295 42,230
    C36,165 60,100 115,68
    C145,52 170,52 200,52"
    fill="none" stroke="#555555" stroke-width="18" opacity="0.06"
    filter="url(#softBlur)"
    stroke-linecap="round"/>

  <!-- Main brush stroke — thick section (brush first touches paper) -->
  <path d="M195,55
    C250,50 305,65 340,110
    C365,142 375,185 370,225"
    fill="none" stroke="url(#dryBrush1)" stroke-width="22"
    stroke-linecap="round"
    filter="url(#inkTexture)"/>

  <!-- Continues — medium thickness -->
  <path d="M370,225
    C365,275 340,320 300,345
    C260,368 215,375 170,365"
    fill="none" stroke="url(#dryBrush2)" stroke-width="18"
    stroke-linecap="round"
    filter="url(#inkTexture)"/>

  <!-- Thinning as brush lifts -->
  <path d="M170,365
    C125,355 80,325 58,280
    C40,242 38,200 45,160"
    fill="none" stroke="url(#dryBrush3)" stroke-width="14"
    stroke-linecap="round"
    filter="url(#inkTexture)"/>

  <!-- Final thin section — dry brush trailing off -->
  <path d="M45,160
    C52,120 72,85 105,68
    C130,55 155,52 180,54"
    fill="none" stroke="#444444" stroke-width="8" opacity="0.4"
    stroke-linecap="round"
    filter="url(#roughEdge)"/>

  <!-- Dry brush wisps at trailing end (gap where circle does not close) -->
  <path d="M178,55 Q182,54 186,54" fill="none" stroke="#666666" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <path d="M176,57 Q180,55 185,55" fill="none" stroke="#777777" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <path d="M174,59 Q178,57 183,57" fill="none" stroke="#888888" stroke-width="1" opacity="0.1" stroke-linecap="round"/>

  <!-- Ink pooling where brush pressed harder -->
  <ellipse cx="210" cy="54" rx="12" ry="4" fill="#1a1a1a" opacity="0.15" filter="url(#tinyBlur)"/>
  <ellipse cx="355" cy="145" rx="5" ry="8" fill="#1a1a1a" opacity="0.1" filter="url(#tinyBlur)"/>
  <ellipse cx="300" cy="348" rx="8" ry="4" fill="#1a1a1a" opacity="0.08" filter="url(#tinyBlur)"/>

  <!-- Subtle ink splatters near start of stroke -->
  <circle cx="225" cy="48" r="1.5" fill="#222222" opacity="0.3" filter="url(#tinyBlur)"/>
  <circle cx="232" cy="45" r="0.8" fill="#333333" opacity="0.25"/>
  <circle cx="218" cy="44" r="1" fill="#333333" opacity="0.2"/>
  <circle cx="240" cy="50" r="0.6" fill="#444444" opacity="0.2"/>

  <!-- Inner texture — very subtle wash residue -->
  <path d="M200,100 Q240,95 270,115 Q250,105 220,108 Q200,112 200,100Z"
    fill="#888888" opacity="0.03" filter="url(#softBlur)"/>
  <path d="M300,200 Q310,240 290,270 Q305,240 295,210 Q290,195 300,200Z"
    fill="#888888" opacity="0.02" filter="url(#softBlur)"/>
</svg>