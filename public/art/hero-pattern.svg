<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none" opacity="0.15">
  <!-- Botanical + Cloud pattern -->
  <defs>
    <pattern id="bp" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Ginkgo leaf cluster -->
      <path d="M40 180 Q50 140 30 120 Q10 100 30 80 Q50 60 40 40" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M35 180 Q60 150 50 130 Q40 110 55 90" stroke="currentColor" stroke-width="0.4" fill="none" opacity="0.2"/>
      <!-- Cloud wisps -->
      <path d="M100 50 Q120 40 140 50 Q160 40 180 50" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.2"/>
      <path d="M110 55 Q130 48 150 55" stroke="currentColor" stroke-width="0.3" fill="none" opacity="0.15"/>
      <!-- Botanical dot clusters -->
      <circle cx="160" cy="140" r="1.5" fill="currentColor" opacity="0.15"/>
      <circle cx="165" cy="145" r="1" fill="currentColor" opacity="0.1"/>
      <circle cx="155" cy="142" r="0.8" fill="currentColor" opacity="0.12"/>
      <!-- Vine tendril -->
      <path d="M80 190 Q90 170 85 150 Q80 130 90 110" stroke="currentColor" stroke-width="0.4" fill="none" opacity="0.2"/>
      <path d="M85 160 Q95 155 100 160" stroke="currentColor" stroke-width="0.3" fill="none" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bp)"/>
</svg>