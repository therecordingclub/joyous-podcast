<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#080D19"/>
  <!-- Speed lines -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="250" x2="600" y2="250" stroke="#C9A96E" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#C9A96E" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="350" x2="500" y2="350" stroke="#C9A96E" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="400" x2="300" y2="400" stroke="#C9A96E" stroke-width="0.5" opacity="0.3"/>
  <!-- Racing grid pattern -->
  <rect x="900" y="150" width="30" height="30" fill="#C9A96E" opacity="0.1"/>
  <rect x="930" y="180" width="30" height="30" fill="#C9A96E" opacity="0.1"/>
  <rect x="960" y="150" width="30" height="30" fill="#C9A96E" opacity="0.1"/>
  <rect x="990" y="180" width="30" height="30" fill="#C9A96E" opacity="0.1"/>
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#C9A96E" letter-spacing="8">PRIME LAP</text>
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#F5F0E8" opacity="0.6">Where Innovation Meets the Fast Lane</text>
</svg>
